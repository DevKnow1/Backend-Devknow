services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devknow
      POSTGRES_USER: devknow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devknow}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devknow -d devknow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/devknow
      DB_USER: devknow
      DB_PASSWORD: ${DB_PASSWORD:-devknow}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-y-aleatorio-123456}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@devknow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-llama3.1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      AI_SEND_DIMENSIONS: ${AI_SEND_DIMENSIONS:-false}
      STORAGE_DIR: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8081}:8080"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage:
